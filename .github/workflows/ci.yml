name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install clang-format==22.1.8
      - name: clang-format
        run: clang-format --dry-run --Werror $(git ls-files 'Source/*.h' 'Source/*.cpp' 'tests/*.h' 'tests/*.cpp')

  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Cache das dependências (JUCE, Catch2)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configurar
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Testes de DSP
        run: ctest --test-dir build -C Release --output-on-failure

      - name: pluginval
        shell: pwsh
        run: |
          # Diagnóstico temporário: grava dump se o pluginval crashar
          New-Item -ItemType Directory -Force D:\dumps | Out-Null
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpFolder /t REG_EXPAND_SZ /d D:\dumps /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpType /t REG_DWORD /d 1 /f
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $vst3 = Get-ChildItem build/finale_plugin_artefacts/Release/VST3 -Filter *.vst3 | Select-Object -First 1
          ./pluginval/pluginval.exe --strictness-level 10 --verbose --validate-in-process --timeout-ms 300000 --validate $vst3.FullName
          $code = $LASTEXITCODE
          Write-Host "pluginval exit code: $code"
          if ($code -ne 0) {
            Start-Sleep 5
            $cdb = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue
            Get-ChildItem D:\dumps | ForEach-Object {
              Write-Host "== dump: $($_.FullName)"
              if ($cdb) {
                $sym = ((Get-ChildItem build -Recurse -Filter *.pdb | ForEach-Object DirectoryName | Sort-Object -Unique) -join ";")
                & $cdb.FullName -z $_.FullName -y "$sym;srv*C:\sym*https://msdl.microsoft.com/download/symbols" -c ".ecxr; kn 60; q"
              }
            }
            if (-not $cdb) { Write-Host "cdb nao encontrado" }
            exit 1
          }

      - name: Publicar build pra testar na DAW
        uses: actions/upload-artifact@v4
        with:
          name: finale-windows-${{ github.sha }}
          path: |
            build/finale_plugin_artefacts/Release/VST3
            build/finale_plugin_artefacts/Release/Standalone/*.exe
